# ═══════════════════════════════════════════════════════════════
# SonarQube Configuration for RutaSegura Backend
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Project Configuration
# ───────────────────────────────────────────────────────────────
sonar.projectKey=rutasegura-backend
sonar.projectName=RutaSegura Backend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# ───────────────────────────────────────────────────────────────
# Paths Configuration
# ───────────────────────────────────────────────────────────────
sonar.sources=src/
sonar.tests=src/
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/coverage/**
sonar.sourceIncludings=**/*.ts,**/*.js,**/*.tsx,**/*.jsx

# ───────────────────────────────────────────────────────────────
# Coverage Configuration (Jest)
# ───────────────────────────────────────────────────────────────
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ───────────────────────────────────────────────────────────────
# Server Configuration
# ───────────────────────────────────────────────────────────────
sonar.host.url=http://localhost:9000
sonar.login=${SONAR_LOGIN}

# ───────────────────────────────────────────────────────────────
# Analysis Configuration
# ───────────────────────────────────────────────────────────────
sonar.language=ts
sonar.typescript.eslint.enabled=false
sonar.scm.exclusions.disabled=false

# ───────────────────────────────────────────────────────────────
# Quality Gate Configuration
# ───────────────────────────────────────────────────────────────
# Note: Quality Gates se configuran en la UI de SonarQube
# Recomendado: coverage >= 70% (ya alcanzado)
